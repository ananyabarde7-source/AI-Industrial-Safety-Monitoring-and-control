<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictive Safety Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f0f0f;
            color: #e0e0e0;
            line-height: 1.5;
        }

        header {
            background-color: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4ade80;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .main-section {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            margin-bottom: 30px;
        }

        .camera-panel {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 0;
            overflow: hidden;
            border-radius: 4px;
        }

        .camera-feed {
            width: 100%;
            height: auto;
            display: block;
            background-color: #000;
            aspect-ratio: 4 / 3;
        }

        .status-panel {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 16px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .status-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .status-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            font-weight: 600;
        }

        .status-value {
            font-size: 14px;
            font-weight: 500;
            padding: 8px 0;
        }

        .status-normal {
            color: #4ade80;
        }

        .status-slow {
            color: #fbbf24;
        }

        .status-stop {
            color: #f87171;
        }

        .divider {
            height: 1px;
            background-color: #2a2a2a;
        }

        .events-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 12px;
        }

        .events-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            font-size: 13px;
        }

        .events-table thead {
            background-color: #242424;
            border-bottom: 1px solid #2a2a2a;
        }

        .events-table th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .events-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #242424;
        }

        .events-table tr:last-child td {
            border-bottom: none;
        }

        .event-time {
            color: #999;
            min-width: 70px;
        }

        .event-zone {
            min-width: 80px;
            color: #fbbf24;
        }

        .event-risk {
            min-width: 70px;
            font-weight: 500;
        }

        .risk-low {
            color: #4ade80;
        }

        .risk-medium {
            color: #fbbf24;
        }

        .risk-high {
            color: #f87171;
        }

        .event-state {
            min-width: 70px;
        }

        .event-message {
            color: #aaa;
            flex-grow: 1;
            font-size: 12px;
        }

        .controls-section {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 16px;
            border-radius: 4px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        button {
            background-color: #242424;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 10px 14px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        button:hover {
            background-color: #2a2a2a;
            border-color: #4a4a4a;
        }

        button:active {
            background-color: #1a1a1a;
        }

        .canvas-container {
            background-color: #000;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 8px;
            margin-top: 12px;
        }

        #zoneCanvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
        }

        @media (max-width: 900px) {
            .main-section {
                grid-template-columns: 1fr;
            }

            .controls-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 16px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 12px 16px;
            }

            .header-title {
                font-size: 16px;
            }

            .events-table {
                font-size: 12px;
            }

            .events-table th,
            .events-table td {
                padding: 8px;
            }

            .controls-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">Predictive Safety Monitor</div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>ONLINE</span>
        </div>
    </header>

    <div class="container">
        <div class="main-section">
            <div class="camera-panel">
                <img id="cameraFeed" class="camera-feed" src="/video_feed" alt="Live Camera Feed">
            </div>

            <div class="status-panel">
                <div>
                    <div class="status-label">System Status</div>
                    <div class="status-value" id="statusValue">NORMAL</div>
                </div>

                <div class="divider"></div>

                <div class="status-group">
                    <div class="status-label">State</div>
                    <div class="status-value" id="stateValue">NORMAL</div>
                </div>

                <div class="status-group">
                    <div class="status-label">Risk Level</div>
                    <div class="status-value" id="riskValue">LOW</div>
                </div>

                <div class="divider"></div>

                <div class="status-group">
                    <div class="status-label">Current Zone</div>
                    <div class="status-value" id="currentZoneValue">SAFE</div>
                </div>

                <div class="status-group">
                    <div class="status-label">Predicted Zone</div>
                    <div class="status-value" id="predictedZoneValue">SAFE</div>
                </div>

                <div class="divider"></div>

                <div class="status-group">
                    <div class="status-label">Velocity</div>
                    <div class="status-value" id="velocityValue">0.0 px/s</div>
                </div>

                <div class="status-group">
                    <div class="status-label">Person Detected</div>
                    <div class="status-value" id="personValue">NO</div>
                </div>
            </div>
        </div>

        <div class="events-section">
            <div class="section-title">Safety Events</div>
            <table class="events-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Zone</th>
                        <th>Risk</th>
                        <th>State</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="eventsBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #666; padding: 20px;">
                            Waiting for events...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="controls-section">
            <div class="section-title">Safety Zone Configuration</div>
            <div class="controls-grid">
                <button id="drawSafeBtn">Draw Safe</button>
                <button id="drawWarningBtn">Draw Warning</button>
                <button id="drawDangerBtn">Draw Danger</button>
                <button id="saveZonesBtn">Save</button>
                <button id="undoBtn">Undo</button>
                <button id="clearBtn">Clear</button>
            </div>
            <div class="canvas-container">
                <canvas id="zoneCanvas" width="320" height="240"></canvas>
            </div>
        </div>
    </div>

    <script>
        const API_STATE_INTERVAL = 300; // ms
        const API_LOGS_INTERVAL = 3000; // ms

        let currentZone = null;
        let canvas = document.getElementById('zoneCanvas');
        let ctx = canvas.getContext('2d');
        let zones = { safe: [], warning: [], danger: [] };
        let isDrawing = false;
        let undoStack = [];

        // Initialize
        function init() {
            loadZones();
            setInterval(updateState, API_STATE_INTERVAL);
            setInterval(updateLogs, API_LOGS_INTERVAL);
            setupCanvasEvents();
            setupButtons();
        }

        // Load zones from server
        async function loadZones() {
            try {
                const response = await fetch('/api/zones');
                const data = await response.json();
                zones = {
                    safe: data.safe || [],
                    warning: data.warning || [],
                    danger: data.danger || []
                };
                redrawZones();
            } catch (e) {
                console.error('Error loading zones:', e);
            }
        }

        // Update system state
        async function updateState() {
            try {
                const response = await fetch('/api/state');
                const state = await response.json();

                // Update status with color coding
                const statusValue = document.getElementById('statusValue');
                statusValue.textContent = state.status;
                statusValue.className = 'status-value status-' + state.status.toLowerCase();

                document.getElementById('stateValue').textContent = state.status;
                
                const riskValue = document.getElementById('riskValue');
                riskValue.textContent = state.risk_level;
                riskValue.className = 'status-value risk-' + state.risk_level.toLowerCase();

                document.getElementById('currentZoneValue').textContent = state.current_zone;
                document.getElementById('predictedZoneValue').textContent = state.predicted_zone;
                document.getElementById('velocityValue').textContent = state.velocity.toFixed(1) + ' px/s';
                document.getElementById('personValue').textContent = state.person_detected ? 'YES' : 'NO';
            } catch (e) {
                console.error('Error updating state:', e);
            }
        }

        // Update event logs
        async function updateLogs() {
            try {
                const response = await fetch('/api/logs');
                const data = await response.json();
                const logs = data.logs || [];

                if (logs.length === 0) {
                    document.getElementById('eventsBody').innerHTML =
                        '<tr><td colspan="5" style="text-align: center; color: #666; padding: 20px;">No events</td></tr>';
                    return;
                }

                const tbody = document.getElementById('eventsBody');
                tbody.innerHTML = '';

                // Parse and display last 15 events
                logs.slice(-15).reverse().forEach(logLine => {
                    const row = parseLogLine(logLine);
                    if (row) {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="event-time">${row.time}</td>
                            <td class="event-zone">${row.zone}</td>
                            <td class="event-risk risk-${row.risk.toLowerCase()}">${row.risk}</td>
                            <td class="event-state">${row.state}</td>
                            <td class="event-message">${row.message}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                });
            } catch (e) {
                console.error('Error updating logs:', e);
            }
        }

        // Parse log line
        function parseLogLine(logLine) {
            // Format: "2024-01-15 12:34:56,123 - ZONE: SAFE | PRED: SAFE | RISK: LOW | STATE: NORMAL | REASON: SAFE ZONE"
            const match = logLine.match(/(\d{2}):(\d{2}):(\d{2})/);
            if (!match) return null;

            const time = `${match[1]}:${match[2]}:${match[3]}`;
            
            let zone = 'UNKNOWN', risk = 'LOW', state = 'NORMAL', message = '';

            if (logLine.includes('ZONE:')) {
                const zoneMatch = logLine.match(/ZONE:\s*(\w+)/);
                zone = zoneMatch ? zoneMatch[1] : 'UNKNOWN';
            }

            if (logLine.includes('RISK:')) {
                const riskMatch = logLine.match(/RISK:\s*(\w+)/);
                risk = riskMatch ? riskMatch[1] : 'LOW';
            }

            if (logLine.includes('STATE:')) {
                const stateMatch = logLine.match(/STATE:\s*(\w+)/);
                state = stateMatch ? stateMatch[1] : 'NORMAL';
            }

            if (logLine.includes('REASON:')) {
                const reasonMatch = logLine.match(/REASON:\s*(.+?)(?:\||$)/);
                message = reasonMatch ? reasonMatch[1].trim() : '';
            } else if (logLine.includes('ALERT:')) {
                const alertMatch = logLine.match(/ALERT:\s*(.+?)$/);
                message = alertMatch ? alertMatch[1].trim() : '';
            }

            return { time, zone, risk, state, message };
        }

        // Canvas drawing functions
        function setupCanvasEvents() {
            canvas.addEventListener('mousedown', (e) => {
                if (!currentZone) return;
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (canvas.height / rect.height);
                zones[currentZone].push({ x, y });
                redrawZones();
            });

            canvas.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });

            document.addEventListener('mouseup', () => {
                isDrawing = false;
            });
        }

        function setupButtons() {
            document.getElementById('drawSafeBtn').addEventListener('click', () => {
                undoStack.push(JSON.stringify(zones));
                currentZone = 'safe';
                canvas.style.cursor = 'crosshair';
                zones.safe = [];
                redrawZones();
            });

            document.getElementById('drawWarningBtn').addEventListener('click', () => {
                undoStack.push(JSON.stringify(zones));
                currentZone = 'warning';
                canvas.style.cursor = 'crosshair';
                zones.warning = [];
                redrawZones();
            });

            document.getElementById('drawDangerBtn').addEventListener('click', () => {
                undoStack.push(JSON.stringify(zones));
                currentZone = 'danger';
                canvas.style.cursor = 'crosshair';
                zones.danger = [];
                redrawZones();
            });

            document.getElementById('saveZonesBtn').addEventListener('click', saveZones);

            document.getElementById('undoBtn').addEventListener('click', () => {
                if (undoStack.length > 0) {
                    zones = JSON.parse(undoStack.pop());
                    currentZone = null;
                    canvas.style.cursor = 'default';
                    redrawZones();
                }
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                undoStack.push(JSON.stringify(zones));
                zones = { safe: [], warning: [], danger: [] };
                currentZone = null;
                canvas.style.cursor = 'default';
                redrawZones();
            });
        }

        function redrawZones() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const colors = { safe: '#22c55e', warning: '#eab308', danger: '#ef4444' };
            const names = ['safe', 'warning', 'danger'];

            names.forEach(name => {
                const points = zones[name];
                if (points.length === 0) return;

                ctx.strokeStyle = colors[name];
                ctx.lineWidth = 2;
                ctx.beginPath();
                points.forEach((p, i) => {
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                    ctx.fillStyle = colors[name];
                    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
                });
                if (points.length > 1) ctx.closePath();
                ctx.stroke();
            });
        }

        async function saveZones() {
            if (zones.safe.length < 3 || zones.warning.length < 3 || zones.danger.length < 3) {
                alert('Each zone needs at least 3 points');
                return;
            }

            try {
                await fetch('/api/zones', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(zones)
                });
                currentZone = null;
                canvas.style.cursor = 'default';
                alert('Zones saved successfully');
            } catch (e) {
                alert('Error saving zones: ' + e);
            }
        }

        // Start
        init();
    </script>
</body>
</html>
